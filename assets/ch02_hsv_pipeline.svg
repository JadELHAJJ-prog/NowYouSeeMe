<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 160" width="680" height="160">
  <rect width="680" height="160" fill="#fafaf8"/>

  <!-- Step boxes -->
  <rect x="20"  y="50" width="100" height="60" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="70"  y="77" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle">BGR image</text>
  <text x="70"  y="93" font-family="monospace" font-size="10" fill="#3b82f6" text-anchor="middle">(H, W, 3)</text>

  <rect x="160" y="50" width="100" height="60" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="210" y="77" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">HSV image</text>
  <text x="210" y="93" font-family="monospace" font-size="10" fill="#22c55e" text-anchor="middle">H  S  V</text>

  <rect x="300" y="50" width="100" height="60" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="350" y="70" font-family="monospace" font-size="11" fill="#854d0e" text-anchor="middle">inRange</text>
  <text x="350" y="86" font-family="monospace" font-size="10" fill="#a16207" text-anchor="middle">lo .. hi</text>
  <text x="350" y="101" font-family="monospace" font-size="10" fill="#a16207" text-anchor="middle">threshold</text>

  <rect x="440" y="50" width="100" height="60" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="490" y="70" font-family="monospace" font-size="11" fill="#6b21a8" text-anchor="middle">raw mask</text>
  <text x="490" y="86" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">0 or 255</text>
  <text x="490" y="101" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">(noisy)</text>

  <rect x="580" y="50" width="82" height="60" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="621" y="70" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">clean</text>
  <text x="621" y="86" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">mask</text>
  <text x="621" y="101" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">OPEN+CLOSE</text>

  <!-- Arrows -->
  <line x1="120" y1="80" x2="158" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="260" y1="80" x2="298" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="400" y1="80" x2="438" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="540" y1="80" x2="578" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Step labels -->
  <text x="70"  y="130" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">input</text>
  <text x="210" y="130" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">cvtColor</text>
  <text x="350" y="130" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">threshold</text>
  <text x="490" y="130" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">binary</text>
  <text x="621" y="130" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">morph</text>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>
</svg>
