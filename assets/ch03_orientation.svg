<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 200" width="680" height="200">
  <rect width="680" height="200" fill="#fafaf8"/>

  <!-- Labels -->
  <text x="110" y="20" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">angle = -35 deg  (w less than h, add 90)</text>
  <text x="370" y="20" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">angle = 0 deg  (horizontal bag)</text>
  <text x="590" y="20" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">angle = -90 deg  (vertical bag)</text>

  <!-- Bag 1: rotated -35 deg -->
  <g transform="translate(110,110) rotate(-35)">
    <rect x="-70" y="-22" width="140" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#92400e" text-anchor="middle">cookie bag</text>
  </g>
  <!-- Rotated bbox -->
  <g transform="translate(110,110) rotate(-35)">
    <rect x="-70" y="-22" width="140" height="44" rx="0" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <!-- Angle arc -->
  <line x1="110" y1="110" x2="170" y2="110" stroke="#888" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="118" y="130" font-family="monospace" font-size="10" fill="#d97706">-35 deg</text>

  <!-- Bag 2: horizontal -->
  <g transform="translate(370,110)">
    <rect x="-70" y="-22" width="140" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#92400e" text-anchor="middle">cookie bag</text>
  </g>
  <g transform="translate(370,110)">
    <rect x="-70" y="-22" width="140" height="44" rx="0" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="365" y="165" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">0 deg = no rotation</text>

  <!-- Bag 3: vertical -->
  <g transform="translate(590,110) rotate(-90)">
    <rect x="-70" y="-22" width="140" height="44" rx="6" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#92400e" text-anchor="middle">cookie bag</text>
  </g>
  <g transform="translate(590,110) rotate(-90)">
    <rect x="-70" y="-22" width="140" height="44" rx="0" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4 3"/>
  </g>
  <text x="585" y="165" font-family="monospace" font-size="10" fill="#444" text-anchor="middle">-90 deg = vertical</text>

  <!-- Legend -->
  <rect x="240" y="178" width="12" height="8" fill="none" stroke="#059669" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="256" y="186" font-family="monospace" font-size="10" fill="#666">minAreaRect output</text>
</svg>
