<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 240" width="680" height="240">
  <rect width="680" height="240" fill="#fafaf8"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Input -->
  <rect x="10" y="95" width="80" height="50" rx="5" fill="#e2e8f0" stroke="#94a3b8" stroke-width="1"/>
  <text x="50" y="117" font-family="monospace" font-size="10" fill="#334155" text-anchor="middle">640x640</text>
  <text x="50" y="131" font-family="monospace" font-size="10" fill="#334155" text-anchor="middle">RGB</text>

  <line x1="90" y1="120" x2="110" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Backbone -->
  <rect x="110" y="30" width="120" height="180" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="170" y="52" font-family="monospace" font-size="11" fill="#5b21b6" text-anchor="middle">Backbone</text>
  <text x="170" y="67" font-family="monospace" font-size="9" fill="#7c3aed" text-anchor="middle">CSPDarknet</text>

  <rect x="120" y="78" width="100" height="28" rx="4" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="170" y="96" font-family="monospace" font-size="9" fill="#4c1d95" text-anchor="middle">P3  80x80  small</text>

  <rect x="120" y="116" width="100" height="28" rx="4" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="170" y="134" font-family="monospace" font-size="9" fill="#4c1d95" text-anchor="middle">P4  40x40  med</text>

  <rect x="120" y="154" width="100" height="28" rx="4" fill="#c4b5fd" stroke="#8b5cf6" stroke-width="0.5"/>
  <text x="170" y="172" font-family="monospace" font-size="9" fill="#4c1d95" text-anchor="middle">P5  20x20  large</text>

  <!-- Arrows backbone to neck -->
  <line x1="230" y1="92"  x2="270" y2="92"  stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="230" y1="130" x2="270" y2="130" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>
  <line x1="230" y1="168" x2="270" y2="168" stroke="#8b5cf6" stroke-width="1" stroke-dasharray="3 2" marker-end="url(#a)"/>

  <!-- Neck -->
  <rect x="270" y="55" width="100" height="130" rx="6" fill="#d1fae5" stroke="#6ee7b7" stroke-width="1"/>
  <text x="320" y="77" font-family="monospace" font-size="11" fill="#065f46" text-anchor="middle">Neck</text>
  <text x="320" y="91" font-family="monospace" font-size="9" fill="#047857" text-anchor="middle">FPN + PAN</text>
  <text x="320" y="115" font-family="monospace" font-size="9" fill="#047857" text-anchor="middle">fuses all</text>
  <text x="320" y="129" font-family="monospace" font-size="9" fill="#047857" text-anchor="middle">3 scales</text>
  <text x="320" y="143" font-family="monospace" font-size="9" fill="#047857" text-anchor="middle">bidirectional</text>

  <line x1="370" y1="120" x2="390" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Detection head -->
  <rect x="390" y="55"  width="115" height="55" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="447" y="77" font-family="monospace" font-size="10" fill="#854d0e" text-anchor="middle">Detection head</text>
  <text x="447" y="93" font-family="monospace" font-size="9" fill="#a16207" text-anchor="middle">box + class score</text>

  <!-- Seg head -->
  <rect x="390" y="130" width="115" height="55" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="447" y="152" font-family="monospace" font-size="10" fill="#991b1b" text-anchor="middle">Mask head</text>
  <text x="447" y="168" font-family="monospace" font-size="9" fill="#b91c1c" text-anchor="middle">32 proto masks</text>

  <line x1="505" y1="82"  x2="525" y2="98"  stroke="#666" stroke-width="1" marker-end="url(#a)"/>
  <line x1="505" y1="157" x2="525" y2="142" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <!-- NMS -->
  <rect x="525" y="95" width="80" height="50" rx="6" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
  <text x="565" y="117" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">NMS</text>
  <text x="565" y="131" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">deduplicate</text>

  <line x1="605" y1="120" x2="625" y2="120" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output -->
  <rect x="625" y="80" width="48" height="80" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="649" y="103" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">box</text>
  <text x="649" y="118" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">conf</text>
  <text x="649" y="133" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">class</text>
  <text x="649" y="148" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">mask</text>

  <!-- Bottom labels -->
  <text x="170" y="225" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">extract features</text>
  <text x="320" y="225" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">fuse scales</text>
  <text x="447" y="225" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">predict</text>
  <text x="649" y="225" font-family="monospace" font-size="10" fill="#666" text-anchor="middle">output</text>
</svg>
