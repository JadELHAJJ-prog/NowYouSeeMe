<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 180" width="680" height="180">
  <rect width="680" height="180" fill="#fafaf8"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Stage 1: Raw cloud -->
  <rect x="10"  y="40" width="110" height="80" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="65"  y="67" font-family="monospace" font-size="10" fill="#991b1b" text-anchor="middle">Raw cloud</text>
  <text x="65"  y="83" font-family="monospace" font-size="10" fill="#b91c1c" text-anchor="middle">~300k pts</text>
  <text x="65"  y="99" font-family="monospace" font-size="10" fill="#b91c1c" text-anchor="middle">bin+walls+floor</text>
  <text x="65"  y="115" font-family="monospace" font-size="10" fill="#b91c1c" text-anchor="middle">+objects</text>

  <line x1="120" y1="80" x2="148" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 2: After downsample -->
  <rect x="150" y="40" width="110" height="80" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="205" y="67" font-family="monospace" font-size="10" fill="#854d0e" text-anchor="middle">Voxel down</text>
  <text x="205" y="83" font-family="monospace" font-size="10" fill="#a16207" text-anchor="middle">~15k pts</text>
  <text x="205" y="99" font-family="monospace" font-size="10" fill="#a16207" text-anchor="middle">same shape</text>
  <text x="205" y="115" font-family="monospace" font-size="10" fill="#a16207" text-anchor="middle">20x faster</text>

  <line x1="260" y1="80" x2="288" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 3: After passthrough -->
  <rect x="290" y="40" width="110" height="80" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="345" y="67" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">Passthrough</text>
  <text x="345" y="83" font-family="monospace" font-size="10" fill="#1d4ed8" text-anchor="middle">~4k pts</text>
  <text x="345" y="99" font-family="monospace" font-size="10" fill="#1d4ed8" text-anchor="middle">bin interior</text>
  <text x="345" y="115" font-family="monospace" font-size="10" fill="#1d4ed8" text-anchor="middle">only</text>

  <line x1="400" y1="80" x2="428" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 4: After RANSAC -->
  <rect x="430" y="40" width="110" height="80" rx="6" fill="#f3e8ff" stroke="#d8b4fe" stroke-width="1"/>
  <text x="485" y="67" font-family="monospace" font-size="10" fill="#6b21a8" text-anchor="middle">RANSAC floor</text>
  <text x="485" y="83" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">removed</text>
  <text x="485" y="99" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">objects only</text>
  <text x="485" y="115" font-family="monospace" font-size="10" fill="#7c3aed" text-anchor="middle">~2k pts</text>

  <line x1="540" y1="80" x2="568" y2="80" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Stage 5: Clusters -->
  <rect x="570" y="40" width="100" height="80" rx="6" fill="#dcfce7" stroke="#4ade80" stroke-width="1.5"/>
  <text x="620" y="67" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">DBSCAN</text>
  <text x="620" y="83" font-family="monospace" font-size="10" fill="#15803d" text-anchor="middle">clusters</text>
  <text x="620" y="99" font-family="monospace" font-size="10" fill="#15803d" text-anchor="middle">1 per object</text>
  <text x="620" y="115" font-family="monospace" font-size="10" fill="#15803d" text-anchor="middle">pick topmost</text>

  <!-- Step labels -->
  <text x="65"  y="155" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">input</text>
  <text x="205" y="155" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">step 1</text>
  <text x="345" y="155" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">step 2</text>
  <text x="485" y="155" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">step 3</text>
  <text x="620" y="155" font-family="monospace" font-size="10" fill="#888" text-anchor="middle">output</text>
</svg>
