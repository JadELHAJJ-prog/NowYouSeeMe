<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="680" height="320">
  <rect width="680" height="320" fill="#fafaf8"/>

  <!-- Title -->
  <text x="340" y="28" font-family="monospace" font-size="13" fill="#444" text-anchor="middle">Image array shape: (height, width, channels)</text>

  <!-- Grid representing pixels -->
  <g transform="translate(40, 50)">
    <!-- Rows label -->
    <text x="-8" y="90" font-family="monospace" font-size="11" fill="#666" text-anchor="middle" transform="rotate(-90,-8,90)">height = rows</text>

    <!-- Columns label -->
    <text x="150" y="-8" font-family="monospace" font-size="11" fill="#666" text-anchor="middle">width = columns</text>

    <!-- Draw pixel grid 6x5 -->
    <g opacity="0.9">
      <rect x="0"   y="0"   width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="50"  y="0"   width="50" height="35" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <rect x="100" y="0"   width="50" height="35" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
      <rect x="150" y="0"   width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="200" y="0"   width="50" height="35" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="250" y="0"   width="50" height="35" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>

      <rect x="0"   y="35"  width="50" height="35" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="50"  y="35"  width="50" height="35" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
      <rect x="100" y="35"  width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="150" y="35"  width="50" height="35" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <rect x="200" y="35"  width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="250" y="35"  width="50" height="35" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>

      <rect x="0"   y="70"  width="50" height="35" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <rect x="50"  y="70"  width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="100" y="70"  width="50" height="35" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="150" y="70"  width="50" height="35" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
      <rect x="200" y="70"  width="50" height="35" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <rect x="250" y="70"  width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>

      <rect x="0"   y="105" width="50" height="35" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
      <rect x="50"  y="105" width="50" height="35" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="100" y="105" width="50" height="35" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
      <rect x="150" y="105" width="50" height="35" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
      <rect x="200" y="105" width="50" height="35" fill="#fce7f3" stroke="#f9a8d4" stroke-width="1"/>
      <rect x="250" y="105" width="50" height="35" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
    </g>

    <!-- Index labels on one pixel -->
    <text x="25" y="22" font-family="monospace" font-size="10" fill="#1e40af" text-anchor="middle">[0,0]</text>
    <text x="275" y="128" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">[3,5]</text>

    <!-- Arrow pointing to single pixel zoom -->
    <line x1="300" y1="87" x2="360" y2="87" stroke="#666" stroke-width="1.5" stroke-dasharray="4 3"/>
  </g>

  <!-- Single pixel zoom -->
  <g transform="translate(400, 80)">
    <text x="85" y="-12" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">one pixel = 3 bytes (BGR)</text>
    <rect x="0"  y="0" width="50" height="50" fill="#3b82f6" rx="4"/>
    <rect x="55" y="0" width="50" height="50" fill="#22c55e" rx="4"/>
    <rect x="110" y="0" width="50" height="50" fill="#ef4444" rx="4"/>
    <text x="25"  y="58" font-family="monospace" font-size="12" fill="#1e40af" text-anchor="middle">B</text>
    <text x="80"  y="58" font-family="monospace" font-size="12" fill="#166534" text-anchor="middle">G</text>
    <text x="135" y="58" font-family="monospace" font-size="12" fill="#991b1b" text-anchor="middle">R</text>
    <text x="25"  y="74" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">0-255</text>
    <text x="80"  y="74" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">0-255</text>
    <text x="135" y="74" font-family="monospace" font-size="11" fill="#444" text-anchor="middle">0-255</text>
  </g>

  <!-- HSV comparison -->
  <g transform="translate(40, 220)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#444">BGR mixes color + brightness</text>
    <rect x="0"  y="10" width="80" height="30" fill="#b45309" rx="3"/>
    <text x="40" y="30" font-family="monospace" font-size="10" fill="white" text-anchor="middle">bright light</text>
    <rect x="90" y="10" width="80" height="30" fill="#78350f" rx="3"/>
    <text x="130" y="30" font-family="monospace" font-size="10" fill="white" text-anchor="middle">dim light</text>
    <text x="185" y="28" font-family="monospace" font-size="11" fill="#666">different values, same object</text>
  </g>

  <g transform="translate(40, 275)">
    <text x="0" y="0" font-family="monospace" font-size="12" fill="#444">HSV separates color from brightness</text>
    <rect x="0"  y="10" width="80" height="30" fill="#d97706" rx="3"/>
    <text x="40" y="30" font-family="monospace" font-size="10" fill="white" text-anchor="middle">H=20 bright</text>
    <rect x="90" y="10" width="80" height="30" fill="#b45309" rx="3" opacity="0.6"/>
    <text x="130" y="30" font-family="monospace" font-size="10" fill="white" text-anchor="middle">H=20 dim</text>
    <text x="185" y="28" font-family="monospace" font-size="11" fill="#166534">same hue, same object</text>
  </g>
</svg>
