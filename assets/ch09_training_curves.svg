<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <rect width="680" height="220" fill="#fafaf8"/>

  <!-- Axis -->
  <line x1="60" y1="20" x2="60" y2="170" stroke="#94a3b8" stroke-width="1.5"/>
  <line x1="60" y1="170" x2="630" y2="170" stroke="#94a3b8" stroke-width="1.5"/>

  <!-- Y axis labels -->
  <text x="52" y="25"  font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">2.0</text>
  <text x="52" y="60"  font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">1.5</text>
  <text x="52" y="95"  font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">1.0</text>
  <text x="52" y="130" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">0.5</text>
  <text x="52" y="170" font-family="monospace" font-size="10" fill="#64748b" text-anchor="end">0.0</text>

  <!-- Grid lines -->
  <line x1="60" y1="25"  x2="630" y2="25"  stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="60"  x2="630" y2="60"  stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="95"  x2="630" y2="95"  stroke="#f1f5f9" stroke-width="1"/>
  <line x1="60" y1="130" x2="630" y2="130" stroke="#f1f5f9" stroke-width="1"/>

  <!-- X axis labels -->
  <text x="60"  y="185" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">0</text>
  <text x="200" y="185" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">10</text>
  <text x="345" y="185" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">25</text>
  <text x="490" y="185" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">40</text>
  <text x="630" y="185" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle">50</text>
  <text x="345" y="202" font-family="monospace" font-size="10" fill="#94a3b8" text-anchor="middle">epoch</text>

  <!-- Axis label -->
  <text x="20" y="100" font-family="monospace" font-size="10" fill="#64748b" text-anchor="middle" transform="rotate(-90,20,100)">loss / mAP</text>

  <!-- box_loss curve (red, falling) -->
  <!-- maps: value 2.0 -> y=25, 0.0 -> y=170. scale = 72.5 per unit -->
  <polyline
    points="60,25 80,38 100,52 130,65 160,78 200,92 250,104 300,114 360,122 420,128 490,133 560,136 630,138"
    fill="none" stroke="#ef4444" stroke-width="2"/>

  <!-- cls_loss curve (orange, falling) -->
  <polyline
    points="60,32 80,44 100,57 130,70 160,84 200,96 250,107 300,116 360,123 420,128 490,132 560,135 630,137"
    fill="none" stroke="#f97316" stroke-width="2"/>

  <!-- val mAP50 curve (green, rising) -->
  <polyline
    points="60,170 80,162 100,152 130,140 160,126 200,112 250,98 300,86 360,78 420,72 490,68 560,66 630,65"
    fill="none" stroke="#22c55e" stroke-width="2.5"/>

  <!-- Best epoch marker -->
  <line x1="490" y1="20" x2="490" y2="170" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="494" y="35" font-family="monospace" font-size="9" fill="#64748b">best.pt</text>

  <!-- Legend -->
  <rect x="430" y="100" width="190" height="64" rx="4" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <line x1="440" y1="116" x2="460" y2="116" stroke="#ef4444" stroke-width="2"/>
  <text x="465" y="120" font-family="monospace" font-size="9" fill="#334155">box_loss (train)</text>
  <line x1="440" y1="132" x2="460" y2="132" stroke="#f97316" stroke-width="2"/>
  <text x="465" y="136" font-family="monospace" font-size="9" fill="#334155">cls_loss (train)</text>
  <line x1="440" y1="148" x2="460" y2="148" stroke="#22c55e" stroke-width="2.5"/>
  <text x="465" y="152" font-family="monospace" font-size="9" fill="#334155">mAP50 (val)</text>
</svg>
