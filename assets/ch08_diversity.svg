<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <rect width="680" height="220" fill="#fafaf8"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Row 1 -->
  <rect x="10"  y="20" width="95" height="70" rx="6" fill="#ede9fe" stroke="#a78bfa" stroke-width="1"/>
  <text x="57"  y="44" font-family="monospace" font-size="11" fill="#5b21b6" text-anchor="middle">Orientation</text>
  <text x="57"  y="60" font-family="monospace" font-size="9"  fill="#7c3aed" text-anchor="middle">0  45  90 deg</text>
  <text x="57"  y="75" font-family="monospace" font-size="9"  fill="#7c3aed" text-anchor="middle">+ random angles</text>

  <rect x="120" y="20" width="95" height="70" rx="6" fill="#fef9c3" stroke="#fde047" stroke-width="1"/>
  <text x="167" y="44" font-family="monospace" font-size="11" fill="#854d0e" text-anchor="middle">Lighting</text>
  <text x="167" y="60" font-family="monospace" font-size="9"  fill="#a16207" text-anchor="middle">bright  dim</text>
  <text x="167" y="75" font-family="monospace" font-size="9"  fill="#a16207" text-anchor="middle">side-lit  window</text>

  <rect x="230" y="20" width="95" height="70" rx="6" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="277" y="44" font-family="monospace" font-size="11" fill="#991b1b" text-anchor="middle">Occlusion</text>
  <text x="277" y="60" font-family="monospace" font-size="9"  fill="#b91c1c" text-anchor="middle">10  30  50 pct</text>
  <text x="277" y="75" font-family="monospace" font-size="9"  fill="#b91c1c" text-anchor="middle">covered</text>

  <!-- Row 2 -->
  <rect x="10"  y="120" width="95" height="70" rx="6" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="57"  y="144" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">Bin fill</text>
  <text x="57"  y="160" font-family="monospace" font-size="9"  fill="#15803d" text-anchor="middle">1 item  full</text>
  <text x="57"  y="175" font-family="monospace" font-size="9"  fill="#15803d" text-anchor="middle">stacked</text>

  <rect x="120" y="120" width="95" height="70" rx="6" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="167" y="144" font-family="monospace" font-size="11" fill="#1e40af" text-anchor="middle">Background</text>
  <text x="167" y="160" font-family="monospace" font-size="9"  fill="#1d4ed8" text-anchor="middle">white  metal</text>
  <text x="167" y="175" font-family="monospace" font-size="9"  fill="#1d4ed8" text-anchor="middle">cardboard  foam</text>

  <rect x="230" y="120" width="95" height="70" rx="6" fill="#f0fdf4" stroke="#4ade80" stroke-width="1.5"/>
  <text x="277" y="144" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">Distance</text>
  <text x="277" y="160" font-family="monospace" font-size="9"  fill="#15803d" text-anchor="middle">30  50  70cm</text>
  <text x="277" y="175" font-family="monospace" font-size="9"  fill="#15803d" text-anchor="middle">top + 15 deg off</text>

  <!-- Target counts box -->
  <rect x="360" y="20" width="300" height="170" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="510" y="44" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">Collection target per class</text>

  <rect x="380" y="58" width="80" height="28" rx="4" fill="#e2e8f0" stroke="#94a3b8" stroke-width="0.5"/>
  <text x="420" y="76" font-family="monospace" font-size="9" fill="#475569" text-anchor="middle">20 ideal</text>

  <line x1="460" y1="72" x2="472" y2="72" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="472" y="58" width="80" height="28" rx="4" fill="#c7d2fe" stroke="#818cf8" stroke-width="0.5"/>
  <text x="512" y="76" font-family="monospace" font-size="9" fill="#3730a3" text-anchor="middle">30 varied</text>

  <line x1="552" y1="72" x2="564" y2="72" stroke="#666" stroke-width="1" marker-end="url(#a)"/>

  <rect x="564" y="58" width="80" height="28" rx="4" fill="#bbf7d0" stroke="#4ade80" stroke-width="0.5"/>
  <text x="604" y="76" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">50 occluded</text>

  <text x="420" y="112" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">baseline</text>
  <text x="512" y="112" font-family="monospace" font-size="9" fill="#64748b" text-anchor="middle">robust</text>
  <text x="604" y="112" font-family="monospace" font-size="9" fill="#166534" text-anchor="middle">production</text>

  <text x="510" y="145" font-family="monospace" font-size="10" fill="#475569" text-anchor="middle">Total: 100 images</text>
  <text x="510" y="163" font-family="monospace" font-size="10" fill="#475569" text-anchor="middle">x3 augmentation</text>
  <text x="510" y="178" font-family="monospace" font-size="11" fill="#166534" text-anchor="middle">= 300 training samples</text>
</svg>
