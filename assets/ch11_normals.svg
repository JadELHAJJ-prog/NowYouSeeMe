<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 220" width="680" height="220">
  <rect width="680" height="220" fill="#fafaf8"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#22c55e" stroke-width="2" stroke-linecap="round"/>
    </marker>
    <marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M2 1L8 5L2 9" fill="none" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    </marker>
  </defs>

  <!-- Case 1: flat object -->
  <text x="165" y="18" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">Flat object</text>

  <!-- Flat bag -->
  <rect x="65" y="130" width="200" height="40" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
  <text x="165" y="155" font-family="monospace" font-size="10" fill="#92400e" text-anchor="middle">cookie bag (flat)</text>

  <!-- Vertical normal -->
  <line x1="165" y1="130" x2="165" y2="40" stroke="#22c55e" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="178" y="85" font-family="monospace" font-size="10" fill="#166534">normal</text>
  <text x="178" y="99" font-family="monospace" font-size="10" fill="#166534">[0, 0, -1]</text>

  <!-- Vertical gripper approach -->
  <line x1="140" y1="40" x2="140" y2="128" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <text x="108" y="80" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">gripper</text>
  <text x="108" y="92" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">approach</text>
  <text x="108" y="104" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">(straight down)</text>

  <text x="165" y="195" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">tilt = 0 deg, full contact</text>

  <!-- Divider -->
  <line x1="340" y1="10" x2="340" y2="210" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Case 2: tilted object -->
  <text x="510" y="18" font-family="monospace" font-size="11" fill="#334155" text-anchor="middle">Tilted object</text>

  <!-- Tilted bag -->
  <g transform="translate(510, 150) rotate(-20)">
    <rect x="-100" y="-20" width="200" height="40" rx="5" fill="#fde68a" stroke="#d97706" stroke-width="1.5"/>
    <text x="0" y="5" font-family="monospace" font-size="10" fill="#92400e" text-anchor="middle">cookie bag (tilted)</text>
  </g>

  <!-- Tilted surface normal -->
  <line x1="510" y1="150" x2="466" y2="48" stroke="#22c55e" stroke-width="2.5" marker-end="url(#g)"/>
  <text x="548" y="100" font-family="monospace" font-size="10" fill="#166534">normal</text>
  <text x="548" y="114" font-family="monospace" font-size="10" fill="#166534">tilted 20 deg</text>

  <!-- Tilted gripper approach -->
  <line x1="490" y1="50" x2="503" y2="143" stroke="#3b82f6" stroke-width="2" stroke-dasharray="5 3" marker-end="url(#b)"/>
  <text x="432" y="85" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">gripper</text>
  <text x="432" y="97" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">follows</text>
  <text x="432" y="109" font-family="monospace" font-size="9" fill="#1d4ed8" text-anchor="middle">normal</text>

  <!-- Tilt angle arc -->
  <text x="510" y="195" font-family="monospace" font-size="10" fill="#166534" text-anchor="middle">tilt = 20 deg, square contact</text>
</svg>
